<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MRM Care — Digital Community Platform</title>
    <meta name="description" content="Faith, learning, and coordinated community care platform for Muslims and reverts." />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#065f46" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MRM Care" />
    <meta name="application-name" content="MRM Care" />
    
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Open Graph -->
    <meta property="og:title" content="MRM Care — Digital Community Platform" />
    <meta property="og:description" content="Faith, learning, and community care for Muslims and reverts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            console.log('MRM Care ServiceWorker registered:', reg.scope);
          }).catch((err) => {
            console.error('ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
